
name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main # Экшен будет запускаться автоматически при каждом пуше в main

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Даем права на запись в ветку gh-pages
      
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Build project
        run: npm run build

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
